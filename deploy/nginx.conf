# The public entry point. The Web app and the API must be one site (session cookies are
# SameSite=Lax, decision D12), so Nginx serves both: the built app, and /api/ and
# /gateway/ proxied to the API, WebSockets and server-sent events included.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # HTTPS: uncomment the server block below, then redirect plain HTTP to it:
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/witx-locations.inc;
}

