# WitX on one host: PostgreSQL, the API (with the Gateway hub), the worker, and Nginx
# serving the Web app in front of the API. Gateways run on the hosts next to the phones
# (see deploy/gateway/) and dial in through Nginx.
#
#   cp deploy/.env.example deploy/.env      # fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml run --rm api admin add-user \
#       --tenant acme --subject <oidc-sub> --name "Ann" --role owner
#   docker compose -f deploy/compose.yaml run --rm worker plugin install basics

name: witx

x-cloud: &cloud
  image: witx-cloud:${WITX_VERSION:-local}
  build:
    context: ..
    dockerfile: deploy/cloud.Dockerfile
  env_file: .env
  environment:
    WITX_DATABASE_URL: postgresql://witx_app_login:${WITX_APP_PASSWORD:?}@postgres:5432/witx
    WITX_ADMIN_DATABASE_URL: postgresql://witx_owner:${WITX_OWNER_PASSWORD:?}@postgres:5432/witx
  # Installed plugins and the skills written in WitX: the API saves them, the
  # worker loads them. `docker compose run --rm worker plugin install basics`.
  volumes:
    - objects:/data/objects
    - plugins:/data/plugins
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      WITX_OWNER_PASSWORD: ${WITX_OWNER_PASSWORD:?}
      WITX_APP_PASSWORD: ${WITX_APP_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/witx.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "witx"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *cloud
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *cloud
    command: ["api", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *cloud
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Database, object store, and every catalog model through the provider's free model
    # list (no inference): an expired key or a withdrawn model shows as unhealthy.
    healthcheck:
      test: ["CMD", "witx", "check"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 20s

  web:
    image: witx-web:${WITX_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${WITX_HTTP_PORT:-80}:80"
      # - "443:443"   # with the HTTPS server block in nginx.conf
    # volumes:
    #   - /etc/letsencrypt/live/witx.example.com:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres:
  objects:
  plugins:
