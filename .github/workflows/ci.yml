name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WITX_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make setup
      - run: pnpm --filter @witx/web exec playwright install --with-deps chromium webkit
      - run: make check
      - name: Check Preview plugin compatibility
        run: |
          git clone --depth 1 https://github.com/FoLAWy-py/witx-plugins-preview.git "$RUNNER_TEMP/witx-plugins-preview"
          uv run --locked witx plugin check "$RUNNER_TEMP/witx-plugins-preview"
          uv run --locked python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from witx.harness.plugins import OFFICIAL

          manifest = Path(os.environ["RUNNER_TEMP"]) / "witx-plugins-preview/.witx-plugin/marketplace.json"
          assert json.loads(manifest.read_text())["name"] == OFFICIAL, "Preview marketplace name differs from the built-in source"
          PYTHON
