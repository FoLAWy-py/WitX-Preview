name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WITX_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make setup
      - run: pnpm --filter @witx/web exec playwright install --with-deps chromium
      - run: make check
      # The official plugins must still fit this build: a renamed or removed tool
      # or effect shows here, naming the skills to change in witx-plugins.
      - run: git clone --depth 1 https://github.com/FoLAWy-py/witx-plugins.git /tmp/witx-plugins
      - run: uv run --locked witx plugin check /tmp/witx-plugins
